<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>There is nothing here except 3rBjy</title>
  <style>
    /* Clean, minimal and responsive layout */
    :root{color-scheme: dark;}
    html,body{height:100%;}
    body{
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000000; /* أسود */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
    }

    /* الخلفية: توهّج أبيض مركزي */
    .bg-glow{
      position:fixed;
      inset:0;
      pointer-events:none;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.06) 10%, transparent 40%);
      z-index:0;
      filter: blur(28px);
    }

    .wrap{
      position:relative;
      z-index:1;
      text-align:center;
      padding:2rem;
    }

    /* النص الكبير الأحمر المتوهج المتغير السرعة */
    .main{
      font-weight:800;
      user-select:none;
      font-size:clamp(28px, 10vw, 120px);
      color:#ff2b2b; /* أحمر أساسي */
      text-transform:none;
      margin:0 0 0.6rem 0;
      line-height:0.9;
      /* توهّج خارج النص */
      text-shadow: 0 0 6px rgba(255,43,43,0.8), 0 0 18px rgba(255,43,43,0.45);
      animation: pulseGlow 0.9s linear infinite;
    }

    /* نبض التوهج: يخف ويقوى بسرعة */
    @keyframes pulseGlow{
      0%{
        text-shadow: 0 0 4px rgba(255,43,43,0.6), 0 0 10px rgba(255,43,43,0.35);
        transform: translateY(0);
        opacity:1;
      }
      50%{
        text-shadow: 0 0 20px rgba(255,43,43,1), 0 0 40px rgba(255,43,43,0.6);
        transform: translateY(-2px);
        opacity:0.98;
      }
      100%{
        text-shadow: 0 0 4px rgba(255,43,43,0.6), 0 0 10px rgba(255,43,43,0.35);
        transform: translateY(0);
        opacity:1;
      }
    }

    /* النص الصغير تحتية */
    .sub{
      font-size:clamp(12px, 2.6vw, 18px);
      color:#ddd;
      opacity:0.9;
      margin-top:0.6rem;
      letter-spacing:0.06em;
    }

    /* تحسين تجربة القراءة في الشاشات الصغيرة */
    @media (max-width:420px){
      .main{font-size:clamp(22px, 12vw, 56px);}
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="wrap">
    <h1 class="main">There is nothing here except 3rBjy</h1>
    <div class="sub">Say</div>
  </div>
</body>
</html>
